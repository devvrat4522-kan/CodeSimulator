services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: sim
    ports:
      - "5433:5432"
    volumes:
      - sim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sim_postgres: